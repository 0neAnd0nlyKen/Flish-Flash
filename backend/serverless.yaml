# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: satusatunyaken
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: flish-flash-aws
service: flish-flash-backend
useDotenv: true
provider:
  name: aws
  runtime: go1.x
  region: ap-southeast-1
  stage: prod

functions:
  api:
    memorySize: 3008
    timeout: 10
    handler: bin/main
    events:
      - http:
          path: /greetings
          method: GET

package:
  patterns:
    - bin/*